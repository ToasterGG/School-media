<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Media</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #1a1d24;
      --muted: #667085;
      --line: #dfe3ec;
      --primary: #2166ef;
      --primary-soft: #eaf1ff;
      --danger: #d93025;
      --success: #1f8f5f;
      --shadow: 0 12px 35px rgba(26, 29, 36, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 24%, var(--bg) 100%);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }
    .login {
      width: min(100%, 420px);
      padding: 24px 20px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2rem, 5vw, 2.6rem);
      margin-bottom: 18px;
      text-align: center;
    }
    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    input, button, textarea {
      font: inherit;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      color: var(--text);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: 2px solid rgba(33, 102, 239, 0.2);
      border-color: var(--primary);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .12s ease, opacity .12s ease;
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: wait; }
    .primary {
      background: var(--primary);
      color: white;
    }
    .secondary {
      background: #edf2ff;
      color: var(--primary);
    }
    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
    .status {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--danger);
    }
    .status.ok {
      color: var(--success);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .stack {
      display: grid;
      gap: 14px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 18px 8px;
    }
    .avatar {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #2166ef, #7d68ff);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      width: fit-content;
    }
    .badge.warn {
      background: #fff3d6;
      color: #8a5b00;
    }
    .panel {
      padding: 18px;
    }
    .small {
      font-size: 12px;
      color: var(--muted);
    }
    .hidden { display: none; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 20, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30;
    }
    .modal {
      width: min(100%, 430px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .modal .row {
      justify-content: flex-end;
      margin-top: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .pill strong { font-size: 11px; }
  </style>
</head>
<body>
  <div id="loginView" class="login-shell">
    <div class="card login">
      <h1>School Media</h1>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" placeholder="your-username" />
      </div>
      <div class="field">
        <label for="token">GitHub token</label>
        <input id="token" type="password" autocomplete="current-password" placeholder="ghp_xxx or personal access token" />
      </div>
      <div class="field">
        <label for="accountPassword">Account password</label>
        <input id="accountPassword" type="password" autocomplete="new-password" placeholder="Optional for new accounts" />
      </div>
      <button id="loginBtn" class="primary" style="width:100%;margin-top:4px">Sign in / Sign up</button>
      <div class="muted">New usernames are created automatically. If your account already has a password, enter it here.</div>
      <div id="loginStatus" class="status"></div>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <div class="topbar">
      <div class="brand">School Media</div>
      <div class="row">
        <button id="logoutBtn" class="ghost">Log out</button>
      </div>
    </div>

    <div class="card profile-header">
      <div class="avatar" id="profileAvatar">U</div>
      <div>
        <div id="profileName" style="font-size:1.5rem;font-weight:800;"></div>
        <div id="profileBadges" class="row" style="margin-top:6px"></div>
      </div>
    </div>

    <div class="card panel stack" style="margin-top:16px">
      <div>
        <h3 style="margin-bottom:8px">Account</h3>
        <div class="field">
          <label for="profileBio">Bio</label>
          <textarea id="profileBio" placeholder="Tell everyone about yourself..."></textarea>
        </div>
        <div class="field">
          <label for="newAccountPassword">New account password</label>
          <input id="newAccountPassword" type="password" placeholder="Leave blank to keep current password" />
        </div>
        <div class="field">
          <label for="confirmAccountPassword">Confirm account password</label>
          <input id="confirmAccountPassword" type="password" placeholder="Re-type new password" />
        </div>
        <button id="saveProfileBtn" class="primary" style="width:100%">Save profile</button>
      </div>

      <div>
        <h3 style="margin-bottom:8px">Access</h3>
        <div class="small">Use this to require a password when logging in from another device.</div>
        <div id="passwordStatus" class="small" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const repo = 'ToasterGG/School-media';
    const repoBase = 'https://api.github.com/repos/' + repo + '/contents/';
    const $ = (sel) => document.querySelector(sel);

    let session = null;
    try {
      session = JSON.parse(localStorage.getItem('school-media-session') || 'null');
    } catch (e) {}

    const setStatus = (el, msg, ok = false) => {
      el.textContent = msg || '';
      el.classList.toggle('ok', !!ok);
    };

    const toHash = async (value) => {
      const bytes = new TextEncoder().encode(value || '');
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const apiFetch = (path, extra = {}) => {
      if (!session || !session.token) return Promise.reject(new Error('No active session'));
      return fetch(repoBase + path, {
        cache: 'no-store',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: 'Bearer ' + session.token,
          ...(extra.headers || {})
        },
        ...extra
      });
    };

    const decodeBase64 = (str) => {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(str.replace(/\n/g, '')))));
      } catch (e) {
        return null;
      }
    };

    const encodeBase64 = (obj) => btoa(unescape(encodeURIComponent(JSON.stringify(obj))));

    const getUserFile = async (name) => {
      const r = await apiFetch('users/' + name + '.json');
      if (!r.ok) return null;
      const data = await r.json();
      return { sha: data.sha, data: decodeBase64(data.content) };
    };

    const writeUserFile = async (name, user, sha) => {
      const r = await apiFetch('users/' + name + '.json', {
        method: 'PUT',
        body: JSON.stringify({
          message: 'update user',
          content: encodeBase64(user),
          sha: sha || undefined
        })
      });
      if (!r.ok) {
        const text = await r.text();
        throw new Error('GitHub write failed: ' + r.status + ' ' + text);
      }
      return await r.json();
    };

    const promptForPassword = (title, subtitle) => new Promise((resolve) => {
      const m = $('#modalContent');
      m.innerHTML = `
        <h3>${title}</h3>
        <p class="small" style="margin-bottom:12px">${subtitle}</p>
        <div class="field">
          <label for="pw1">New password</label>
          <input id="pw1" type="password" placeholder="Choose a password" />
        </div>
        <div class="field">
          <label for="pw2">Confirm password</label>
          <input id="pw2" type="password" placeholder="Re-type it" />
        </div>
        <div class="row">
          <button class="ghost" data-action="cancel-password">Later</button>
          <button class="primary" data-action="save-password">Save password</button>
        </div>
      `;
      $('#modalBackdrop').style.display = 'flex';
      $('#modalBackdrop').onclick = (e) => {
        if (e.target === $('#modalBackdrop')) {
          $('#modalBackdrop').style.display = 'none';
          resolve(null);
        }
      };
      $('[data-action="cancel-password"]').onclick = () => {
        $('#modalBackdrop').style.display = 'none';
        resolve(null);
      };
      $('[data-action="save-password"]').onclick = () => {
        const p1 = $('#pw1').value.trim();
        const p2 = $('#pw2').value.trim();
        if (p1.length < 4) {
          setStatus($('#loginStatus'), 'Password must be at least 4 characters.', false);
          return;
        }
        if (p1 !== p2) {
          setStatus($('#loginStatus'), 'Passwords do not match.', false);
          return;
        }
        $('#modalBackdrop').style.display = 'none';
        resolve(p1);
      };
    });

    const openApp = async () => {
      $('#loginView').classList.add('hidden');
      $('#appView').classList.remove('hidden');
      await showProfile();
    };

    const showProfile = async () => {
      if (!session || !session.name) return;
      const u = await getUserFile(session.name);
      const user = u && u.data ? u.data : { name: session.name, bio: '', verified: false, dev: false, password: '' };
      const initials = (user.name || 'U').split(/[^a-z0-9]+/i).filter(Boolean).slice(0,2).map(part => part[0].toUpperCase()).join('') || 'U';
      $('#profileAvatar').textContent = initials;
      $('#profileName').textContent = user.name || session.name;
      $('#profileBio').value = user.bio || '';
      $('#profileBadges').innerHTML = '';
      if (user.verified) {
        $('#profileBadges').insertAdjacentHTML('beforeend', '<span class="badge">Verified</span>');
      }
      if (user.dev) {
        $('#profileBadges').insertAdjacentHTML('beforeend', '<span class="badge warn">Developer</span>');
      }
      if (!user.password) {
        $('#passwordStatus').textContent = 'No account password is set yet.';
      } else {
        $('#passwordStatus').textContent = 'Account password is enabled.';
      }
    };

    const saveProfile = async () => {
      const current = await getUserFile(session.name);
      const user = current && current.data ? current.data : { name: session.name, verified: false, dev: false };
      const newBio = $('#profileBio').value.trim();
      const newPw = $('#newAccountPassword').value.trim();
      const confirmPw = $('#confirmAccountPassword').value.trim();

      if (newPw && newPw.length < 4) {
        setStatus($('#loginStatus'), 'Passwords must be at least 4 chars.', false);
        return;
      }
      if (newPw && newPw !== confirmPw) {
        setStatus($('#loginStatus'), 'New password and confirmation do not match.', false);
        return;
      }

      if (newPw) {
        user.password = await toHash(newPw);
      }
      user.bio = newBio;
      user.name = session.name;
      user.owner = user.owner || session.name;
      user.verified = !!user.verified;
      user.dev = !!user.dev;

      const result = await writeUserFile(session.name, user, current ? current.sha : undefined);
      $('#newAccountPassword').value = '';
      $('#confirmAccountPassword').value = '';
      setStatus($('#loginStatus'), 'Profile saved.', true);
      await showProfile();
    };

    const ensureAccountPassword = async (name, passwordInput) => {
      const userFile = await getUserFile(name);
      const user = userFile && userFile.data ? userFile.data : { name, verified: false, dev: false };
      if (user.password) {
        if (!passwordInput || passwordInput.trim() === '') {
          throw new Error('This account already has a password. Enter it to sign in.');
        }
        const hash = await toHash(passwordInput.trim());
        if (hash !== user.password) {
          throw new Error('Incorrect account password.');
        }
        return user;
      }

      if (passwordInput && passwordInput.trim()) {
        user.password = await toHash(passwordInput.trim());
        await writeUserFile(name, user, userFile ? userFile.sha : undefined);
        return user;
      }

      const chosen = await promptForPassword(
        'Create an account password',
        'This account does not have one yet. Set a password so it is protected on other devices.'
      );
      if (!chosen) {
        return user;
      }
      user.password = await toHash(chosen);
      await writeUserFile(name, user, userFile ? userFile.sha : undefined);
      return user;
    };

    const login = async () => {
      const username = $('#username').value.trim().toLowerCase();
      const token = $('#token').value.trim();
      const accountPassword = $('#accountPassword').value.trim();

      if (!username || !token) {
        setStatus($('#loginStatus'), 'Please enter your username and GitHub token.', false);
        return;
      }

      try {
        setStatus($('#loginStatus'), 'Checking credentials…', false);
        const r = await fetch('https://api.github.com/user', {
          headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
        });
        if (!r.ok) {
          throw new Error('Invalid GitHub token.');
        }

        const currentUser = await r.json();
        const name = username;

        let userFile = await getUserFile(name);
        let user = userFile && userFile.data ? userFile.data : { name, owner: currentUser.login, bio: '', verified: false, dev: false };
        user.name = name;
        user.owner = user.owner || currentUser.login;
        user.verified = !!user.verified;
        user.dev = !!user.dev;

        if (userFile && userFile.data && userFile.data.owner && userFile.data.owner !== currentUser.login) {
          throw new Error('This username is already owned by a different GitHub account.');
        }

        const savedUser = await ensureAccountPassword(name, accountPassword);
        user = { ...user, ...savedUser };

        if (!userFile) {
          await writeUserFile(name, user);
        } else {
          await writeUserFile(name, user, userFile.sha);
        }

        session = { name, token };
        localStorage.setItem('school-media-session', JSON.stringify(session));
        setStatus($('#loginStatus'), 'Signed in successfully.', true);
        $('#accountPassword').value = '';
        $('#token').value = '';
        openApp();
      } catch (err) {
        setStatus($('#loginStatus'), err.message || 'Unable to sign in.', false);
      }
    };

    const logout = () => {
      localStorage.removeItem('school-media-session');
      session = null;
      $('#appView').classList.add('hidden');
      $('#loginView').classList.remove('hidden');
      $('#username').value = '';
      $('#token').value = '';
      $('#accountPassword').value = '';
      setStatus($('#loginStatus'), '', false);
    };

    $('#loginBtn').addEventListener('click', login);
    $('#saveProfileBtn').addEventListener('click', saveProfile);
    $('#logoutBtn').addEventListener('click', logout);

    if (session && session.name && session.token) {
      openApp();
    }
  </script>
</body>
</html>
