<script>

const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',explore:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',reels:'<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M10 9l5 3-5 3z"/>',newp:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',dms:'<path d="M22 3L2 11l7 3 3 7z"/><path d="M22 3L9 14"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',reports:'<path d="M5 22V4M5 4h12l-2 4 2 4H5"/>',flag:'<path d="M5 22V4M5 4h12l-2 4 2 4H5"/>',heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',comment:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',edit:'<path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',sound:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',back:'<path d="M15 5l-7 7 7 7"/>',play:'<path d="M7 4l13 8-13 8z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 9 6 9 6a15 15 0 0 1-3 3.5M6.5 7.5A15 15 0 0 0 3 12s4 6 9 6c1.4 0 2.7-.4 3.8-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/>',rules:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',anon:'<path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-2 2-2-2-2 2-2-2z"/><circle cx="10" cy="10" r="1"/><circle cx="14" cy="10" r="1"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};

const gh=(p,o={})=>fetch(p.startsWith('http')?p:A+p,{cache:'no-store',...o,headers:{Authorization:'Bearer '+S.tok,Accept:'application/vnd.github+json',...(o.headers||{})}});
async function get(p){const r=await gh(p);if(r.status==404)return null;if(!r.ok)throw Error('GitHub '+r.status);const j=await r.json();return{sha:j.sha,data:JSON.parse(unb64(j.content))}}
async function put(p,obj,sha){const r=await gh(p,{method:'PUT',body:JSON.stringify({message:'update',content:b64(JSON.stringify(obj)),sha})});if(!r.ok){const e=new Error('GitHub '+r.status);e.s=r.status;throw e}}
async function upd(p,fn,def){for(let i=0;i<5;i++){const f=await get(p),d=fn(f?f.data:def);try{await put(p,d,f&&f.sha);return d}catch(e){if(e.s!=409&&e.s!=422)throw e;await wait(300*(i+1))}}throw Error('Busy, try again')}
async function ls(d){const r=await gh(d);return r.ok?(await r.json()).map(x=>x.name):[]}
async function img(p){if(IC[p])return IC[p];const r=await gh(p,{headers:{Accept:'application/vnd.github.raw'}});if(!r.ok)throw 0;let b=await r.blob();if(p.endsWith('.mp4'))b=new Blob([b],{type:'video/mp4'});return IC[p]=URL.createObjectURL(b)}
const ld=el=>{if(el.dataset.l)return;el.dataset.l=1;img(el.dataset.p).then(u=>{el.src=u;const rv=el.closest('.rv');if(rv&&rv.dataset.on){el.muted=MUTED;el.play().catch(()=>{})}}).catch(()=>{})};
const LIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){LIO.unobserve(e.target);ld(e.target)}}),{rootMargin:'400px'});
function hy(root=document){root.querySelectorAll('[data-p]:not([data-l])').forEach(el=>{if(el.closest('.rv'))return;el.tagName=='VIDEO'?LIO.observe(el):ld(el)})}
function shrink(f,m=1080){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(f)})}
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'now':s<3600?(s/60|0)+'m':s<86400?(s/3600|0)+'h':(s/86400|0)+'d'};
const av=(n,c='')=>UC[n]?.a?`<img class="av ${c}" data-p="media/av_${n}.jpg" alt="">`:`<span class="av ${c}" style="background:hsl(${[...n].reduce((a,x)=>a+x.charCodeAt(0)*47,0)60} 55% 48%)">${esc(n[0]||'?').toUpperCase()}</span>`;
const badge=n=>(UC[n]?.v?'<span class="vbg" title="Verified">'+VB+'</span>':'')+(UC[n]?.d?'<span class="dbg" title="Developer">'+DB+'</span>':'');
async function loadUC(names){const need=[...new Set(names)].filter(n=>!(n in UC));if(!need.length)return;await Promise.all(need.map(async n=>{const f=await get('users/'+n+'.json');UC[n]=f?{v:!!f.data.verified,d:!!f.data.dev,a:!!f.data.av}:{}}))}

const un=n=>n.replace(/^p\d+v?_/,'').slice(0,-5);
const tags=t=>[...new Set((t.match(/#\w+/g)||[]).map(x=>x.slice(1).toLowerCase()))],ptags=p=>tags(p.cap||''),tsc=t=>(ME.tg[t]||0)+(ME.mt[t]||0);
const scoreP=p=>ptags(p).reduce((a,t)=>a+tsc(t),0)+(!p.an&&(ME.following||[]).includes(p.user)?2:0);
const capH=t=>esc(t||'').replace(/#(\w+)/g,'<a class="tg" data-a="tag" data-t="$1">#$1</a>').replace(/(^|\s)@(\w+)/g,'$1<a class="tg" data-a="user" data-u="$2">@$2</a>');

const isV=id=>/^p\d+v_/.test(id),mp=id=>'media/'+id+(isV(id)?'.mp4':'.jpg');

/* ---- auth ---- */
async function login(name,tok){
  name=name.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(name))throw Error('Username: 3-20 chars, a-z 0-9 _ .');
  const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw Error('Invalid GitHub token');
  const owner=(await r.json()).login;S={name,tok};
  const u=await get('users/'+name+'.json');
  if(u&&u.data.owner!==owner){S=null;throw Error('Username taken by someone else');}
  if(u&&(u.data.verified===undefined||u.data.dev===undefined))await upd('users/'+name+'.json',q=>{if(q.verified===undefined)q.verified=false;if(q.dev===undefined)q.dev=false;return q});
  if(!u)await put('users/'+name+'.json',{name,owner,bio:'',verified:false,dev:false,ts:Date.now()});
  localStorage.setItem('sm',JSON.stringify(S));
}
$('#lb').onclick=async()=>{$('#lb').disabled=true;try{await login($('#lu').value,$('#lt').value.trim());start()}catch(e){toast(e.message)}$('#lb').disabled=false};
async function loadMe(){try{const f=await get('users/'+S.name+'.json');ME=f?f.data:{};ME.tg=ME.tg||{};ME.mt=ME.mt||{}}catch(e){}}
function start(){$('#lg').style.display='none';$('#lt').value='';loadMe().finally(async()=>{applyBg();await loadRules();

  go(localStorage.getItem('rk')==String(RL.ts)?'home':'rules')})}

function postH(p){PM[p.id]=p;const l=p.likes.includes(S.name),sv=(ME.saved||[]).includes(p.id);if(p.hid&&!ME.dev)return `<article class="post" data-id="${p.id}"><div class="hdn">${ic('eyeoff',24)}<div><b>Hidden pending review</b><div class="t">This post is hidden until a developer reviews it.</div></div></div></article>`;
return `<article class="post" data-id="${p.id}">${p.hid?`<div class="hbn">Hidden pending review${p.hb?' (by '+(p.hb=='auto'?'reports':esc(p.hb))+')':''}</div>`:''}<div class="ph">${who(p)}<span class="t">${ago(p.ts)}</span>${p.user==S.name?'<button data-a="edit">'+ic('edit',20)+'</button>':''}${p.user==S.name||ME.dev?'<button data-a="del">'+ic('trash',20)+'</button>':''}</div>${isV(p.id)?`<video data-p="${mp(p.id)}" controls playsinline preload="none" loop></video>`:`<img data-p="${mp(p.id)}" data-a="dbl" alt="">`}<div class="ac"><button data-a="like" class="${l?'on':''}">${ic('heart',24,l)}</button><button data-a="focus">${ic('comment')}</button>${p.user==S.name?'':'<button data-a="report" title="Report">'+ic('flag')+'</button>'}${ME.verified&&!p.hid&&p.user!=S.name?'<button data-a="vhide" title="Hide pending review">'+ic('eyeoff')+'</button>':''}<button data-a="save" class="sv ${sv?'on':''}">${ic('save',24,sv)}</button></div><div class="lk">${p.likes.length?`Liked by <b>${esc(p.likes[p.likes.length-1])}</b>${p.likes.length>1?` and ${p.likes.length-1} other${p.likes.length>2?'s':''}`:''}`:'Be the first to like this'}</div>${p.cap?`<div class="cp"><b>${p.an?'Anonymous':esc(p.user)}</b>${p.an?'':badge(p.user)} ${capH(p.cap)}</div>`:''}<div class="cm">${p.c.filter(c=>!blk(c.u)).map(c=>`<div><b>${esc(c.u)}</b>${badge(c.u)} ${capH(c.t)}${ME.dev||c.u==S.name?` <a class="tg" data-a="dc" data-ts="${c.ts}" data-u="${esc(c.u)}">${ic('x',12)}</a>`:''}</div>`).join('')}</div><div class="ci"><input placeholder="Add a comment&"><button data-a="send">Post</button></div></article>`}
const redraw=(art,p)=>{art.outerHTML=postH(p);hy()};
async function like(art){const id=art.dataset.id,p=PM[id],i=p.likes.indexOf(S.name);i<0?p.likes.push(S.name):p.likes.splice(i,1);bump(ptags(p),i<0?3:-3);redraw(art,p);
  try{const d=await upd('posts/'+id+'.json',q=>{const j=q.likes.indexOf(S.name);(i<0)==(j<0)&&(j<0?q.likes.push(S.name):q.likes.splice(j,1));return q});PM[id]=d}catch(e){toast(e.message)}}

    $('#ss').onclick=async()=>{try{await login($('#su').value,$('#st').value.trim()||S.tok);go('profile')}catch(e){toast(e.message)}};
    $('#lo').onclick=()=>{localStorage.removeItem('sm');location.reload()}}}
async function dms(){M('<p class="mu">Loading&</p>');
  const ks=(await ls('dms')).map(x=>x.slice(0,-5).split('~')).filter(k=>k.includes(S.name)).map(k=>k.find(x=>x!=S.name)||S.name);
  await loadUC(ks);const inf=await Promise.all(ks.map(x=>get('dms/'+[S.name,x].sort().join('~')+'.json').then(f=>f?f.data.m:[]).catch(()=>[])));
  M(`<h3>Messages</h3><div class="row"><input id="nu" class="in" placeholder="Username to message" autocapitalize="none"><button class="btn" data-a="new">Chat</button></div>`+(ks.map((x,i)=>{const m=inf[i],l=m[m.length-1],nw=l&&l.f!=S.name&&m.length>(+localStorage.getItem('seen_'+x)||0);return `<a class="ur" data-a="dm" data-u="${x}">${av(x)}<div style="flex:1;min-width:0"><b>${esc(x)}</b>${badge(x)}<div class="t pv">${l?(l.f==S.name?'You: ':'')+esc(l.t):''}</div></div>${nw?'<i class="dot"></i>':''}</a>`}).join('')||'<p class="mu">No conversations yet.</p>'))}
function chat(u){const p='dms/'+[S.name,u].sort().join('~')+'.json';
  loadUC([u]);
  M(`<div class="ch"><div class="ph"><button data-a="back">${ic('back')}</button>${av(u)}<b>${esc(u)}</b>${badge(u)}</div><div id="ms" class="ms"></div><div class="ci"><input id="mi" placeholder="Message&"><button id="mb">Send</button></div></div>`);
  let n=-1;const r=async()=>{try{const f=await get(p),m=f?f.data.m:[];if(m.length==n)return;n=m.length;localStorage.setItem('seen_'+u,n);const b=$('#ms');if(!b)return;b.innerHTML=m.map(x=>`<div class="b ${x.f==S.name?'me':''}">${esc(x.t)}</div>`).join('');b.scrollTop=1e9}catch(e){}};
  r();poll=setInterval(r,4000);
  const s=async()=>{const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';try{await upd(p,q=>{q.m.push({f:S.name,t,ts:Date.now()});return q},{m:[]});r()}catch(e){toast(e.message)}};
  $('#mb').onclick=s;$('#mi').onkeydown=e=>e.key=='Enter'&&s()}

const rvH=p=>{const l=p.likes.includes(S.name),fl=(ME.following||[]).includes(p.user);return `<div class="rw"><video data-p="${mp(p.id)}" loop playsinline muted data-a="rtap"></video><div class="hb">${ic('heart',96,1)}</div><div class="ro"><div class="rn">${p.an?`<span class="av an">${ic('anon',20)}</span><b>Anonymous</b>`:`<a data-a="user" data-u="${p.user}">${av(p.user)}</a><b data-a="user" data-u="${p.user}">@${esc(p.user)}${badge(p.user)}</b>${p.user==S.name?'':`<button class="fb ${fl?'g':''}" data-a="follow" data-u="${p.user}">${fl?'Following':'Follow'}</button>`}`}</div><div>${capH(p.cap)}</div></div><div class="rb"><button data-a="rlike" class="${l?'on':''}">${ic('heart',28,l)}</button><div>${p.likes.length}</div><button data-a="ropen">${ic('comment',28)}</button><div>${p.c.length}</div>${p.user==S.name?'':'<button data-a="report">'+ic('flag',28)+'</button>'}${ME.verified&&p.user!=S.name?'<button data-a="rvh" title="Hide pending review">'+ic('eyeoff',28)+'</button>':''}${ME.dev?'<button data-a="rdel">'+ic('trash',28)+'</button>':''}<button data-a="rmute">${ic(MUTED?'mute':'sound',28)}</button></div><div class="pgb"><i></i></div></div>`};
async function reels(){
  M('<div id="rl"><p class="mu">Loading&</p></div>');
  const names=(await ls('posts')).filter(n=>/^p\d+v_/.test(n)),rl=$('#rl');
  if(!names.length){rl.innerHTML='<p class="mu">No videos yet. Tap the plus button to upload one.</p>';return}
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  let busy=false,recent=[];rl.innerHTML='';
  const pick=async()=>{const pool=names.filter(n=>!recent.includes(n)),c=sh(pool.length?pool:names).slice(0,5);
    const ps=(await Promise.all(c.map(n=>PC[n]||get('posts/'+n).then(x=>x&&(PC[n]=x.data))))).filter(Boolean).filter(p=>(!p.hid||ME.dev)&&!(blk(p.user)&&!p.an));if(!ps.length)return null;
    const w=ps.map(p=>Math.max(.1,1+scoreP(p)));let r=Math.random()*w.reduce((x,y)=>x+y),i=0;for(;i<w.length-1;i++){r-=w[i];if(r<=0)break}
    recent.push(ps[i].id+'.json');if(recent.length>Math.min(8,names.length-1))recent.shift();return ps[i]};
  const more=async()=>{if(busy)return;busy=true;try{const p=await pick();if(p){await loadUC([p.user]);PM[p.id]=p;const d=document.createElement('div');d.className='rv';d.dataset.i=rl.children.length;d.dataset.id=p.id;d.innerHTML=rvH(p);rl.appendChild(d);io.observe(d)}}catch(e){toast(e.message)}busy=false};
  const io=new IntersectionObserver(es=>es.forEach(e=>{const rv=e.target,v=rv.querySelector('video'),i=+rv.dataset.i;
    if(e.intersectionRatio>.6){rv._t=Date.now();rv.dataset.on=1;ld(v);v.muted=MUTED;v.play().catch(()=>{});
      const nx=rl.children[i+1];if(nx)ld(nx.querySelector('video'));if(i>=rl.children.length-2)more()}
    else{if(rv._t){const d=(Date.now()-rv._t)/1e3;rv._t=0;bump(ptags(PM[rv.dataset.id]),d<2?-.5:Math.min(d,30)/10)}delete rv.dataset.on;v.pause()}}),{root:rl,threshold:[0,.6]});
  await more();await more();await more()}
async function activity(){M('<h3>Activity</h3><div class="sk"></div>');
  const ns=(await ls('posts')).filter(x=>un(x)==S.name).sort().reverse().slice(0,25),ps=(await Promise.all(ns.map(n=>get('posts/'+n)))).filter(Boolean).map(x=>x.data),ev=[];
  ps.forEach(p=>{p.c.forEach(c=>c.u!=S.name&&ev.push([c.ts,c.u,'commented: '+c.t,p.id]));p.likes.forEach(u=>u!=S.name&&ev.push([0,u,'liked your post',p.id]))});
  ev.sort((a,b)=>b[0]-a[0]);await loadUC(ev.map(e=>e[1]));
  M('<h3>Activity</h3>'+(ev.map(e=>`<a class="ur" data-a="open" data-id="${e[3]}">${av(e[1])}<div><b>${esc(e[1])}</b>${badge(e[1])} ${esc(e[2])}</div></a>`).join('')||'<p class="mu">Nothing yet. Likes and comments on your posts show up here.</p>'))}
async function rules(){M('<div class="sk"></div>');await loadRules();const ack=localStorage.getItem('rk')==String(RL.ts);
  M(`<h3>Rules</h3>${ruleH(RL.text)}<p class="t" style="padding:4px 16px">${RL.by?'Last updated by '+esc(RL.by)+' '+ago(RL.ts)+' ago':''}</p><div class="row">${ack?'':'<button class="btn" data-a="ack">I understand</button>'}${ME.dev?'<button class="btn g" data-a="redit">Edit rules</button>':''}</div>`)}
const V={rules,activity,reports,home,explore,tagv,settings,reels,newp,dms,profile,chat};
function go(v,a){clearInterval(poll);$('#modal').style.display='none';$('#modal').innerHTML='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(v=='chat'?'dms':v)));
  Promise.resolve(V[v](a)).catch(e=>{toast(e.message);M('<p class="mu">Something went wrong. Check your token has access to the repo.</p>')});scrollTo(0,0)}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.v)};

document.addEventListener('click',e=>{
  if(e.target===$('#modal')){$('#modal').style.display='none';$('#modal').innerHTML='';return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,art=t.closest('.post');
  if(a=='like')like(art);else if(a=='send')comment(art);else if(a=='del')delPost(art);
  else if(a=='focus')art.querySelector('.ci input').focus();
  else if(a=='user'){go('profile',t.dataset.u.toLowerCase())}
  else if(a=='open')openPost(t.dataset.id);
  else if(a=='dm')go('chat',t.dataset.u);
  else if(a=='back')go('dms');
  else if(a=='vhide'){if(!confirm('Hide this post until a developer reviews it?'))return;const id=art.dataset.id;hidePost(id).then(([d])=>{redraw(art,d);toast('Post hidden until a developer reviews it')}).catch(er=>toast(er.message))}
  else if(a=='rvh'){const rv=t.closest('.rv');if(confirm('Hide this video until a developer reviews it?'))hidePost(rv.dataset.id).then(()=>{rv.remove();toast('Video hidden until reviewed')}).catch(er=>toast(er.message))}
  else if(a=='block'){const u=t.dataset.u,on=blk(u);ME.blocked=on?ME.blocked.filter(x=>x!=u):[...(ME.blocked||[]),u];t.textContent=on?'Block':'Unblock';upd('users/'+S.name+'.json',q=>{const f=q.blocked||[];q.blocked=on?f.filter(x=>x!=u):f.includes(u)?f:[...f,u];return q}).catch(er=>toast(er.message))}
  else if(a=='ack'){localStorage.setItem('rk',String(RL.ts));go('home')}
  else if(a=='redit'&&ME.dev){M(`<h3>Edit rules</h3><div style="padding:0 14px"><p class="t">One rule per line. Start a line with # for a section heading. Changes apply to everyone straight away, and users are asked to read them again.</p><textarea id="rt" class="in" style="min-height:320px">${esc(RL.text)}</textarea><div class="row" style="padding:8px 0"><button class="btn" data-a="rsave">Save</button><button class="btn g" data-a="rdef">Reset to default</button><button class="btn g" data-a="rcan">Cancel</button></div></div>`)}
  else if(a=='rsave'&&ME.dev){const text=$('#rt').value.trim();if(!text)return toast('Rules cannot be empty');upd('rules.json',()=>({text,ts:Date.now(),by:S.name}),{}).then(d=>{RL=d;localStorage.setItem('rk',String(d.ts));toast('Rules updated for everyone');go('rules')}).catch(er=>toast(er.message))}
  else if(a=='rdef')$('#rt').value=DEF;
  else if(a=='rcan')go('rules');
  else if(a=='act')go('activity');
  else if(a=='bg'){const id=t.dataset.id,b=BGS.find(x=>x[0]==id);if(b[2]&&!ME.verified)return toast('Animated backgrounds are for verified users');ME.bg=id;applyBg();upd('users/'+S.name+'.json',q=>{q.bg=id;return q}).catch(er=>toast(er.message));settings()}
  else if(a=='report')openReport(t.closest('[data-id]').dataset.id);
  else if(a=='rcl')closeM();
  else if(a=='rsend'){const id=t.closest('.post').dataset.id,why=document.querySelector('input[name=why]:checked').value,d=$('#rd').value.trim();
    upd('reports/'+id+'.json',q=>{if(!q.r.some(r=>r.u==S.name))q.r.push({u:S.name,why:why+(d?': '+d:''),ts:Date.now()});return q},{id,r:[]}).then(d=>{if(d.r.filter(r=>!r.h).length>=5)upd('posts/'+id+'.json',q=>{if(!q.hid){q.hid=true;q.hb='auto'}return q}).catch(()=>{});closeM();toast('Report sent. Thank you!')}).catch(er=>toast(er.message))}
  else if(a=='rrm'){const rp=t.closest('.rp');if(confirm('Remove this post and delete its files from GitHub?'))killPost(rp.dataset.rid).then(()=>{rp.remove();toast('Post removed')}).catch(er=>toast(er.message))}
  else if(a=='rok'){const rp=t.closest('.rp');Promise.all([rmf('reports/'+rp.dataset.rid+'.json'),upd('posts/'+rp.dataset.rid+'.json',q=>{q.hid=false;delete q.hb;return q})]).then(()=>{rp.remove();toast('Report dismissed, post restored')}).catch(er=>toast(er.message))}
  else if(a=='rdel'){const rv=t.closest('.rv');if(confirm('Delete this video?'))killPost(rv.dataset.id).then(()=>{rv.remove();toast('Deleted')}).catch(er=>toast(er.message))}
  else if(a=='dc'){const id=art.dataset.id,ts=+t.dataset.ts,u=t.dataset.u;upd('posts/'+id+'.json',q=>{q.c=q.c.filter(c=>!(c.ts==ts&&c.u==u));return q}).then(d=>redraw(art,d)).catch(er=>toast(er.message))}
  else if(a=='rtap'){const rv=t.closest('.rv'),n=Date.now();if(n-(rv._c||0)<300){clearTimeout(rv._p);rv._c=0;const b=rv.querySelector('[data-a=rlike]');if(!b.classList.contains('on'))b.click();const h=rv.querySelector('.hb');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}else{rv._c=n;rv._p=setTimeout(()=>{t.paused?t.play():t.pause()},260)}}
  else if(a=='tag')go('tagv',t.dataset.t.toLowerCase());
  else if(a=='addt'){const k=$('#nt').value.trim().replace(/^#/,'').toLowerCase();if(/^\w+$/.test(k)){ME.mt[k]=(ME.mt[k]||0)+10;saveAlg();settings()}else toast('Use letters, numbers or _')}
  else if(a=='tw'){const k=t.dataset.k,d=t.dataset.d;ME.mt[k]=d=='x'?-100:(ME.mt[k]||0)+ +d;saveAlg();settings()}
  else if(a=='rst'){ME.tg={};saveAlg();settings()}
  else if(a=='edit'){const p=PM[art.dataset.id],c=art.querySelector('.cp')||art.querySelector('.lk').insertAdjacentElement('afterend',Object.assign(document.createElement('div'),{className:'cp'}));
    c.innerHTML=`<textarea class="in ed">${esc(p.cap||'')}</textarea><label class="ck"><input type="checkbox" class="ean" ${p.an?'checked':''}> Post anonymously</label><div class="row" style="padding:6px 0"><button class="btn" data-a="esave">Save</button><button class="btn g" data-a="ecancel">Cancel</button></div>`}
  else if(a=='ecancel')redraw(art,PM[art.dataset.id]);
  else if(a=='esave'){const id=art.dataset.id,cap=art.querySelector('.ed').value.trim(),an=art.querySelector('.ean').checked;upd('posts/'+id+'.json',q=>{q.cap=cap;q.an=an;return q}).then(d=>{PM[id]=d;PC[id+'.json']=d;redraw(art,d)}).catch(er=>toast(er.message))}
  else if(a=='tab'){FEED=t.dataset.f;home()}
  else if(a=='more')loadMore();
  else if(a=='ptab'){t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==t));$('#pg').innerHTML=thumbs(t.dataset.k=='s'?(ME.saved||[]).map(i=>i+'.json'):PN);hy()}
  else if(a=='follow'){const u=t.dataset.u,on=(ME.following||[]).includes(u);ME.following=on?ME.following.filter(x=>x!=u):[...(ME.following||[]),u];t.textContent=on?'Follow':'Following';t.classList.toggle('g',!on);if(!on)learnFrom(u);

  else if(a=='save'){const id=art.dataset.id,on=(ME.saved||[]).includes(id);ME.saved=on?ME.saved.filter(x=>x!=id):[...(ME.saved||[]),id];t.classList.toggle('on',!on);t.innerHTML=ic('save',24,!on);
    upd('users/'+S.name+'.json',q=>{const f=q.saved||[];q.saved=on?f.filter(x=>x!=id):f.includes(id)?f:[...f,id];return q}).catch(er=>toast(er.message))}
  else if(a=='rmute'){MUTED=!MUTED;document.querySelectorAll('#rl video').forEach(v=>v.muted=MUTED);document.querySelectorAll('button[data-a=rmute]').forEach(b=>b.innerHTML=ic(MUTED?'mute':'sound',28))}
  else if(a=='rlike'){const id=t.closest('.rv').dataset.id,p=PM[id],i=p.likes.indexOf(S.name);i<0?p.likes.push(S.name):p.likes.splice(i,1);bump(ptags(p),i<0?3:-3);t.classList.toggle('on',i<0);t.innerHTML=ic('heart',28,i<0);t.nextElementSibling.textContent=p.likes.length;
    upd('posts/'+id+'.json',z=>{const j=z.likes.indexOf(S.name);(i<0)==(j<0)&&(j<0?z.likes.push(S.name):z.likes.splice(j,1));return z}).catch(er=>toast(er.message))}
  else if(a=='ropen'){document.querySelectorAll('#rl video').forEach(v=>v.pause());openPost(t.closest('.rv').dataset.id)}
  else if(a=='new'){const u=$('#nu').value.trim().toLowerCase();if(u)go('chat',u)}});
document.addEventListener('dblclick',e=>{const t=e.target.closest('[data-a=dbl]');if(t){const art=t.closest('.post');if(!PM[art.dataset.id].likes.includes(S.name))like(art)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest('.post .ci input'))comment(e.target.closest('.post'))});
